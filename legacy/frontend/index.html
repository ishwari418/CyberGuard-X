<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Shield | Secure Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        /* Premium Auth Overrides */
        body.auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Grid */
        .cyber-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(0, 255, 157, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px);
            }
        }

        .auth-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--primary-green);
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.1), inset 0 0 20px rgba(0, 255, 157, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-logo i {
            font-size: 48px;
            color: var(--primary-green);
            filter: drop-shadow(0 0 10px var(--primary-green));
            margin-bottom: 10px;
        }

        .auth-logo h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin: 0;
        }

        .auth-logo p {
            color: var(--text-gray);
            font-size: 14px;
            letter-spacing: 1px;
        }

        .auth-tabs {
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-tab {
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .auth-tab:hover {
            color: #fff;
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 15px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            background: rgba(0, 255, 157, 0.05);
            border-color: var(--primary-green);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
        }

        .btn-primary {
            background: linear-gradient(90deg, #00ff9d, #00cbcc);
            border: none;
            color: #000;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 15px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.4);
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-link a {
            color: var(--text-gray);
            font-size: 12px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link a:hover {
            color: var(--primary-green);
        }

        /* Glitch Effect on Hover for Logo */
        .auth-logo i:hover {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }
    </style>
</head>

<body class="auth-page">

    <div class="cyber-grid"></div>

    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-shield-halved"></i>
            <h1>Guardian Shield</h1>
            <p>ACCESS CONTROL SYSTEM</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-target="loginForm">Login</button>
            <button class="auth-tab" data-target="signupForm">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <input type="email" id="loginEmail" placeholder="ENTER EMAIL ID" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" placeholder="ENTER PASSWORD" required>
            </div>
            <div class="forgot-link">
                <a href="#" id="showForgot">FORGOT PASSWORD?</a>
            </div>
            <button type="submit" class="btn-primary">AUTHENTICATE</button>
        </form>

        <!-- Register Form -->
        <form id="signupForm" class="auth-form hidden">
            <div class="form-group">
                <input type="text" id="signupUsername" placeholder="CHOOSE USERNAME" required>
            </div>
            <div class="form-group">
                <input type="email" id="signupEmail" placeholder="ENTER EMAIL ID" required>
            </div>
            <div class="form-group">
                <input type="password" id="signupPassword" placeholder="CREATE PASSWORD" required>
            </div>
            <button type="submit" class="btn-primary">REGISTER AGENT</button>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgotForm" class="auth-form hidden">
            <p class="text-muted" style="text-align: center; font-size: 0.9em; margin-bottom: 20px;">
                Enter registered email to receive recovery token.
            </p>
            <div class="form-group">
                <input type="email" id="forgotEmail" placeholder="ENTER EMAIL ID" required>
            </div>
            <button type="submit" class="btn-primary">SEND RECOVERY LINK</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" class="backToLogin"
                    style="color: var(--text-gray); font-size: 0.8em; text-decoration: none;">CANCEL</a>
            </div>
        </form>

        <!-- Reset Password Form -->
        <form id="resetForm" class="auth-form hidden">
            <p class="text-muted" style="text-align: center; font-size: 0.9em; margin-bottom: 20px;">
                Set new secure password.
            </p>
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="NEW PASSWORD" required>
            </div>
            <button type="submit" class="btn-primary">UPDATE CREDENTIALS</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" class="backToLogin"
                    style="color: var(--text-gray); font-size: 0.8em; text-decoration: none;">CANCEL</a>
            </div>
        </form>

    </div>

    <!-- Reusing Auth JS Logic but pointing to this file's elements -->
    <script src="js/auth.js?v=6"></script>
</body>

</html>
